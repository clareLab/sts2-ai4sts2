[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai4sts2"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
authors = [{ name = "clareLab", email = "yaho@clarelab.moe" }]
dependencies = [
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "torch>=2.14,<3",
    "triton-xpu>=3.8",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1"]

[tool.hatch.build.targets.wheel]
packages = ["ai4sts2"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-xpu" }
triton-xpu = { index = "pytorch-xpu" }

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["game: requires the installed game"]
